spring:
  application:
    name: aashraynet
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/aashraynet?serverTimezone=UTC}
    username: ${DB_USERNAME:aashray}
    password: ${DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # Flyway owns the schema
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Base64-encoded secret of at least 32 bytes. ALWAYS override in every real environment.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1kZXYtb25seS1zZWNyZXQtMTIzNDU2}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    public-per-minute: ${PUBLIC_RATE_LIMIT:10}
    login-per-minute: ${LOGIN_RATE_LIMIT:5}
  nearest:
    default-radius-km: 50
  jobs:
    enabled: ${JOBS_ENABLED:true}
    shortage-cron: ${SHORTAGE_CRON:0 0 * * * *}
    snapshot-cron: ${SNAPSHOT_CRON:0 5 * * * *}
    token-cleanup-cron: ${TOKEN_CLEANUP_CRON:0 30 3 * * *}
